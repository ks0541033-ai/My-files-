<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Panel Sale</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }
  .popup {
    background: #0f3460;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
  }
  .popup h2 {
    margin-bottom: 20px;
    color: #e94560;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    background: #1a1a2e;
    color: white;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #ff6b6b; }
  .error {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 14px;
  }
  .sale-title {
    font-size: 28px;
    font-weight: bold;
    color: #e94560;
    animation: blink 1s infinite;
    margin-bottom: 10px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .option {
    background: #1a1a2e;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: 0.3s;
  }
  .option:hover {
    border-color: #e94560;
    transform: scale(1.02);
  }
  .option h3 {
    margin-bottom: 5px;
  }
  .price {
    color: #00ff88;
    font-size: 18px;
    font-weight: bold;
  }
  .payment-options {
    display: none;
    margin-top: 20px;
  }
  .pay-btn {
    background: #00b894;
    margin: 8px 0;
  }
  .pay-btn:hover { background: #00cec9; }
  .hidden { display: none; }
</style>
</head>
<body>

  <!-- Login Popup -->
  <div id="loginPopup" class="popup">
    <h2>Login Required</h2>
    <input type="text" id="loginId" placeholder="Login ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkLogin()">Login</button>
    <p id="errorMsg" class="error"></p>
  </div>

  <!-- Sale Popup -->
  <div id="salePopup" class="popup hidden">
    <div class="sale-title">SALE SALE SALE</div>
    <h2>VIP Panel</h2>
    <p style="margin-bottom: 20px;">Add Sale</p>

    <div class="option" onclick="showPayment(399)">
      <h3>VIP Panel</h3>
      <div class="price">₹399</div>
    </div>

    <div class="option" onclick="showPayment(599)">
      <h3>VIP Location Panel</h3>
      <div class="price">₹599</div>
    </div>

    <div class="option" onclick="showPayment(799)">
      <h3>Brutal Panel Sale</h3>
      <div class="price">₹799</div>
    </div>

    <div id="paymentBox" class="payment-options">
      <h3 style="margin-bottom: 15px;">Choose Payment Method</h3>
      <button class="pay-btn" onclick="payNow('Google Pay')">Google Pay</button>
      <button class="pay-btn" onclick="payNow('PhonePe')">PhonePe</button>
      <button class="pay-btn" onclick="payNow('UPI / Other')">UPI / Other</button>
    </div>
  </div>

<script>
  // सही ID और Password यहाँ सेट करें
  const correctID = "admin";
  const correctPass = "1234";
  let attempts = 0;

  function checkLogin() {
    const id = document.getElementById("loginId").value.trim();
    const pass = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    if (attempts >= 3) {
      errorMsg.innerText = "ABBE LAUDDE PASS LEKE AA";
      return;
    }

    if (id === correctID && pass === correctPass) {
      document.getElementById("loginPopup").classList.add("hidden");
      document.getElementById("salePopup").classList.remove("hidden");
    } else {
      attempts++;
      if (attempts >= 3) {
        errorMsg.innerText = "Please try again later";
      } else {
        errorMsg.innerText = "Incorrect password";
      }
    }
  }

  function showPayment(price) {
    document.getElementById("paymentBox").style.display = "block";
    // selected price store कर सकते हो अगर जरूरत हो
    window.selectedPrice = price;
  }

  function payNow(method) {
    alert("Payment method selected: " + method + "\nAmount: ₹" + window.selectedPrice + "\n\n(यह demo है। असली payment integration बाद में जोड़ सकते हो)");
  }
</script>

</body>
</html>
